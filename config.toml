theme="m10c"
baseurl = "https://d.tflare.com/"
languageCode = "ja-jp"
title = "Hiroyuki Abeの日記"
copyright = "Copyright (c) 2006 - 2026, Hiroyuki Abe"
canonifyurls = true
publishdir = "docs"

[pagination]
  pagerSize = 10

# Hugo 0.60以降のMarkdownエンジン(Goldmark)は既定で生HTMLを出力しないため、
# 記事中の<table>などをこれまで通り表示するために有効化
[markup.goldmark.renderer]
  unsafe = true

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 2

[params]
  author = "Hiroyuki Abe"
  description = "つれずれ日記"
  menu_item_separator = " - "
  [[params.social]]
    icon = "github"
    name = "Github"
    url = "https://github.com/tflare"
  [[params.social]]
    icon = "twitter"
    name = "Twitter"
    url = "https://twitter.com/taki_tflare"
